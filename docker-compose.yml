# Local development stack: API + MongoDB.
# The React client runs separately with `npm run dev` in ./client.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MONGODB_URI=mongodb://mongo:27017/page_pulse
      - CACHE_TTL_MS=60000
      - RATE_LIMIT_MAX=60
    depends_on:
      - mongo

volumes:
  mongo-data:
